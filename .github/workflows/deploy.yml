name: Deploy Housing Price Regression Lab to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate frontend directory
        id: locate-dir
        run: |
          if [ -d "project/frontend" ]; then
            echo "frontend_dir=project/frontend" >> $GITHUB_OUTPUT
          elif [ -d "frontend" ]; then
            echo "frontend_dir=frontend" >> $GITHUB_OUTPUT
          else
            echo "frontend_dir=." >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '${{ steps.locate-dir.outputs.frontend_dir }}/package-lock.json'

      - name: Install dependencies
        working-directory: ${{ steps.locate-dir.outputs.frontend_dir }}
        run: npm ci

      - name: Build frontend
        working-directory: ${{ steps.locate-dir.outputs.frontend_dir }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '${{ steps.locate-dir.outputs.frontend_dir }}/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
